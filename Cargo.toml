[workspace]

[package]
name = "mdlc"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Source 引擎模型编译器 —— studiomdl.exe 的 Rust 重写（MDL/VVD/VTX/PHY）"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/MoRanYue/mdlc"
keywords = ["source-engine", "studiomdl", "mdl", "vvd", "vtx"]
categories = ["command-line-utilities", "game-development", "parser-implementations"]

[dependencies]
# CLI 解析。`default-features = false` 关掉了彩色输出 / 终端探测
# （`color` / `wrap_help` / `env` 等）—— 本工具的输出会被 Crowbar 之类的
# 宿主**逐行抓取**，ANSI 转义码只会污染日志；顺带省掉 anstream/anstyle。
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
indexmap = { version = "2.14.2", features = ["serde"] }
meshopt = "0.6.2"
parry3d = "0.31.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[features]
# 分段计时探针（`src/prof.rs`）。**默认关闭** —— 打开后 `Span::new` 会做
# 一次 `OnceLock` 初始化检查，实测给单 LOD 常见路径带来约 2.5% 开销。
# 只有 `MDLC_PROF=1` 的测量场景才需要：
#   cargo build --release --features profiling
profiling = []
