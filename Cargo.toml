[workspace]

[package]
name = "mdlc"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Source 引擎模型编译器 —— studiomdl.exe 的 Rust 重写（MDL/VVD/VTX/PHY）"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/MoRanYue/mdlc"
keywords = ["source-engine", "studiomdl", "mdl", "vvd", "vtx"]
categories = ["command-line-utilities", "game-development", "parser-implementations"]

[dependencies]
# CLI 解析。**故意用 default-features**：`color` 打开的不是「永远着色」，
# 而是 `ColorChoice::Auto` —— clap 内部把输出包进 `anstream::AutoStream`，
# 直连终端才着色，被 Crowbar 之类的宿主重定向/管道抓取时自动降级成纯文本，
# 所以不会往日志里塞 ANSI 转义码（实测：重定向时 `is_terminal() == false`
# ⟹ `AutoStream` 剥掉全部转义序列）。
#
# `derive` 只给 mdlc **自有**子命令用（`Cli` + `Commands` 枚举 + 各 `Args`）；
# 官方 `studiomdl` 兼容形态仍是 builder —— 它的 ~40 个 flag 由
# `OFFICIAL_FLAGS_NO_VALUE` / `OFFICIAL_FLAGS_WITH_VALUE` 两张表循环生成，
# 表驱动是 derive 表达不了的，硬转会把「归一化认识的」与「clap 接受的」
# 拆成两份清单。见 `src/cli.rs` 的模块文档。
clap = { version = "4.6.7", features = ["derive"] }

# 帮助/错误文案的多语言支持：换掉 clap **自己**写死的英文
# （`Usage:` / `Options` / `Commands` / `Arguments` 标题、12 类错误的
# 措辞、`-h` / `-V` 的说明），按**系统显示语言**自动切换
# （`DesktopLanguageRequester`；未命中时回落到 crate 自带的 `en-US`）。
#
# ⚠️ 边界：它**不翻译** mdlc 自己的命令/参数描述 —— 那些仍是下面
# `about` / `help` 里的中文常量（crate 的设计如此，其 README 亦明示）。
clap-i18n-richformatter = "0.3.2"
indexmap = { version = "2.14.2", features = ["serde"] }

# 日志门面。**故意不加任何 feature**：只需要 `set_logger`（`&'static dyn Log`），
# 它不要求 `std` / `alloc`（只有 `set_boxed_logger` 要求 `alloc`），所以这里
# 用一个 `static` logger 就够了，零分配、零泄漏。
#
# 它本来就在依赖树里（`ena` → `parry3d`、`i18n-embed` 系列、`ureq` / `rustls`），
# 提为直接依赖**不新增任何包**：`Cargo.lock` 里 `log` 的 `[[package]]` 条目原样
# 不动，只在 `mdlc` 的 `dependencies` 列表里多一行。实测（各建独立 crate、
# `lto="thin"` + `codegen-units=1`，相对零依赖基线 130048 B）：`log` 门面本身
# +1.0 KB，加上手写 logger 一共 **+6.7 KB** —— 而 `tracing-subscriber` 最省
# 形态也要 +143 KB，带 `env-filter` 则是 +846 KB。
#
# ⚠️ 选它而不是 `tracing` 的决定性理由有两条，都是**契约**不是偏好：
# ① `tracing-subscriber` 的默认 `fmt::Layer` 把输出写 **stdout** 且 ANSI
#    只认 `NO_COLOR`、**不做终端检测**（`fmt_layer.rs:743`），会同时砸掉
#    `diag` 的 stdout/stderr 分流与「不往重定向文件写转义码」两条硬约束；
#    `log` 门面**自己不写任何字节**，流与格式全由下面的 `Log` 实现决定。
# ② `log` 是全局门面：库侧直接 `log::info!` 即可，**不需要在库里装任何
#    东西**，bin 独占「装 logger + 选流 + 选级别」；`rust_i18n::t!` 被
#    `crate::` 钉死、`tracing` 要处理 subscriber 单例，两者都没这么干净。
log = "0.4.34"

meshopt = "0.6.2"
parry3d = "0.31.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

# 错误类型的 derive。**理由是对外的，不是对内的**：本包同时是库
# （README 的「作为依赖使用」教第三方用 `pipeline` 内置编译器），而
# `Result<_, String>` 让调用方无法分辨失败种类 —— 尤其 `ModelDesc::from_toml`
# 把 `toml::de::Error` 的**行列号** `format!` 掉了，GUI 想高亮出错位置就只能
# 去正则匹配中文字符串。改用具体错误类型后，`match` / `source()` / `?` 都可用。
#
# ⚠️ 它**不改变任何既有文案**：12 个 `impl Display` 逐条搬成 `#[error(...)]`
# 属性，已用探针验证 `to_string()` 逐字节相同（含 `writeln!` 尾换行、
# `iter().map(if/else).collect()` 这类「属性里放表达式」的写法）。
#
# MSRV 1.77 ≤ 本包声明的 1.89。`thiserror` 早已在依赖树里
# （`fluent-syntax` → 传递依赖），这里只是提为直接依赖。
thiserror = "2.0.21"

# 分段计时探针。**故意不加 `optional = true`**：调用点是裸的
# `hotpath::measure_block!(...)`，而 optional 依赖在 feature 关掉时不在
# extern prelude 里，那些调用点会直接解析失败。让依赖常驻之后，
# hotpath 自己的 `hotpath` feature 关着时它走 `lib_off` 分支，
# `measure_block!` 退化成 `{ $expr }`（参数被丢弃，零开销），
# 于是**调用点不需要任何 `#[cfg(...)]` 门禁**，两种构建写法完全一致。
hotpath = "0.26.1"

# 非加密哈希器。`build_vanim_map` 的就近匹配网格用整数三元组做键，
# 一次完整编译要查 486 万次，默认的 SipHash 在这里是纯开销 ——
# 网格**从不被迭代**，格内顺序由显式的倒序回填决定，所以哈希值
# 不可能泄漏到产物里（实测换哈希器后 101/101 parity 逐字节相同）。
#
# 实测（`parity/linnea-export.toml`，函数级同一 span、各 3 轮取中位）：
#   SipHash 130.60 ms → 75.85 ms（**1.72×**），端到端 1.14×。
rustc-hash = "2.1.3"

# FBX 读取。**故意不用 `animsmith-fbx`** —— 它主动丢弃 blend shape / morph
# （`animsmith-core` 的 `model.rs` 里 `blend_shape|morph|shape_key` 零命中），
# 而 mdlc 的表情（flex）系统正建立在 morph 上：FBX 的 shape key 要变成
# flexdesc + flexcontroller + flexrule + vertanim 载荷。
#
# `ufbx` 是它的底层依赖，morph 与采样率都可控。许可 `MIT OR Unlicense`，
# 与 mdlc 的 GPL-3.0-only 兼容。
#
# ⚠️ 它是 C 库（`build.rs` 用 `cc` 编译 `ufbx/ufbx.c`）⟹ 构建需要 C 编译器。
# 实测本机 VS 2026 Community 可用；`edition = "2018"` 且未声明 `rust-version`，
# 对 mdlc 的 MSRV 1.89 无约束。
ufbx = "0.11"

# glTF / GLB 读取（`gltf` + `gltf-json`）。纯 Rust，无构建脚本。
#
# **`default-features = false` 是关键**：默认的 `import` feature 会拉进
# `image` / `png` / `zune-jpeg` / `flate2` / `moxcms` 等 16 个包，而 mdlc
# 只要几何与材质**名**，从不解码纹理像素（实测依赖增量 +22 ⟹ +6）。
#
# 三个 feature 的用途：
#   * `utils`  —— `Primitive::reader` / `Skin::reader`（读 accessor 的唯一入口）
#   * `names`  —— 节点名 / 网格名 / 材质名
#   * `extras` —— `mesh.extras()["targetNames"]`，glTF 2.0 没有「形变目标名」
#                 字段，这是事实标准（Blender 就是这么写的）
#
# ⚠️ **不要**开 `base64` feature：它只打开 crate **自己**的可选依赖，
# 并不 re-export 给下游（`gltf-1.4.1\src\lib.rs` 只有 `pub extern crate
# gltf_json as json;`），解内嵌 `data:` URI 得靠下面那条直接依赖。
#
# ⚠️ 1.4.1 的校验层会把「无 `bufferView` 的 accessor」误判为错误
# （规范允许，表示全零；Blender 导出的 morph target 常态），所以读取走
# `Gltf::from_slice_without_validation` 并自己补三项长度检查
# （见 `src/gltf.rs` 的 `load_buffers` 与 `validate_ranges`）。
#
# ⚠️ 上游 master 已修掉那个误判，但**尚未发版**（`git tag --contains` 为空），
# 且 git 依赖会让 `cargo publish` 被 crates.io 拒绝 ⟹ 这里钉 crates.io 版本。
# 详见 `docs/gltf-support.md` §3.5 / §4.3 / §4.4。
gltf = { version = "1.4", default-features = false, features = [
    "utils",
    "names",
    "extras",
] }

# 解内嵌 `.gltf` 的 `data:` URI。**必须有**：关掉 `import` 之后 `gltf` crate
# 不再自带 data URI 解码，不补这一条的话内嵌 `.gltf` 会**静默读出零顶点**
# （`docs/gltf-support.md` §3.4 实测：`pos=0 idx=0 首顶点=None`，零报错）。
# `0.13` 与 `gltf` 的 `import` 分支同版本 ⟹ 不新增包。
base64 = "0.13"

# 读 `mesh.extras()["targetNames"]`（glTF 的形变目标名）。
# 它已在 `Cargo.lock` 里（`gltf` 的传递依赖）⟹ 加为直接依赖不新增包。
serde_json = "1"

# ---- 更新检测的 HTTP 栈 ----
# `ureq`（同步、纯 Rust）+ `rustls`（`ring` provider）：无 tokio、无 hyper、
# 无系统 TLS 依赖（`native-tls` 在 Linux 上要 libssl-dev，会打断 CI）。
# 实测依赖增量 **+27 个包**；对比 `reqwest`（blocking+rustls+json）的
# **+116 个包**。冷构建代价见 `docs/update-check.md`。
ureq = { version = "3", default-features = false, features = ["rustls"] }

# ---- 仅 Windows：摘掉后台子进程不该继承的 std 句柄 ----
#
# `std::process::Command` 在 Windows 上**无条件**用 `bInheritHandles = TRUE`
# 调 `CreateProcessW`（`inherit_handles` 默认 `true`，且它没有用
# `PROC_THREAD_ATTRIBUTE_HANDLE_LIST` 收窄集合）⟹ 后台子进程会复制**我们
# 进程里所有**可继承句柄，包括调用方为了让 `ReadToEnd()` 拿到 EOF 而建的
# stdout 管道。`Stdio::null()` 挡不住：它只换子进程的 0/1/2。
#
# 用 `windows`（而非 `windows-sys`）：`HANDLE` 是 newtype 而不是 `isize`，
# `GetStdHandle` 直接给 `Result`，`HANDLE::is_invalid()` 一次覆盖 `NULL`
# 与 `INVALID_HANDLE_VALUE` 两个哨兵 —— 这几处正好都是我们容易写错的地方。
# 代价是 +11 个包（含两个 proc-macro crate）；详细取证与实测见
# `docs/update-check.md`。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[build-dependencies]
# 把 `assets/mdlc.rc` 编成 `.res` 并链进 exe —— 也就是让产物带上图标。
#
# 为什么需要外部 crate：PE 的资源段（`.rsrc`）没有稳定的 Rust 内置写法，
# 只能调 Windows SDK 的 `rc.exe` 再给链接器加参数。而「找到 `rc.exe`」
# 本身要处理 VS 各版本安装路径、Windows Kits 注册表键、`%INCLUDE%` 要指向
# SDK 头文件目录、非 MSVC 目标要改用 `windres` + `ar` —— 全是环境适配，
# 与 mdlc 无关，`embed-resource` 已覆盖全。
#
# 只进 `build-dependencies`，**不污染运行时的依赖树**：它不会出现在
# `cargo tree -e normal` 里，也不影响产物体积。
#
# 平台行为（见其 `src/non_windows.rs` 与 `src/windows_msvc.rs`）：
# 非 Windows 目标上是**空操作**，所以 `ubuntu-latest` 的 CI job 不受影响。
#
# ⚠️ Windows/MSVC 上它把「找不到 `rc.exe`」与「`rc.exe` 编译失败」**都报成
# `Failed`**（`is_supported()` 恒返回 `None`），两种情形的区别只在错误文案里。
# 所以 `build.rs` 不靠它的返回值分类，而是自己先探一遍 `rc.exe` 在不在：
# 不在就只发 `cargo:warning`（环境缺失不该拦构建），在却编译失败才 panic。
#
# MSRV 1.76 ≤ 本包声明的 1.89。`Cargo.lock` 实际变化：包数 207 → 214，
# 其中真正新增 6 个包（`embed-resource`、`rustc_version`、`semver`、
# `vswhom`、`vswhom-sys`、`winreg`），外加 `windows-sys` 多出 0.59.0 一个
# 版本（仓库本来就有 0.52.0 与 0.61.2，属重复而非冲突）。`cc` 与 `toml`
# 已在锁里（`meshopt-sys` / 本包自己）。
embed-resource = "3.0"

[features]
# 分段计时探针。**默认关闭** —— 打开后 `measure_block!` 会在每个计时点做
# 一次原子读，实测给单 LOD 常见路径带来约 2.5% 开销（历史数据见 `src/lod.rs`
# `unify_lods_impl` 的注释）。只有测量场景才需要：
#   cargo build --release --features hotpath
#
# 打开后**没有运行时开关**：`#[hotpath::main]` 一进 `main` 就无条件建 guard
# （起 worker 线程 + 本地 metrics server）并在退出时写出报告。想改报告路径用
# `HOTPATH_OUTPUT_PATH`，想关掉 metrics server 用 `HOTPATH_METRICS_SERVER_OFF=1`。
#
# 这一行只是把上面那个依赖的 `hotpath` feature 转发出去；关掉时 hotpath
# 整体退化成空实现，仍然参与编译（依赖树多 hotpath + hotpath-macros 两项）。
hotpath = ["hotpath/hotpath"]

[profile.release]
# thin LTO + 单 codegen unit。实测（交错 A/B，同一台机器，各 10-14 轮）：
#   相对「无 LTO + 默认 cgu=16」：t100000 +2.9%、lod4 +6.0%。
#   `codegen-units` 是关键变量：默认的 16 会把 thin LTO 的收益吃掉大半，
#   显式设成 1 之后 linnea-export +3.54%、lod4 +5.25%（两项都有可测差异）。
# 选 thin 而不是 fat：thin+cgu=1 与 fat+cgu=1 实测等价
# （linnea-export 上 thin 反而快 2.40%，lod4 中性），而 fat 构建要 107 s、
# thin 只要 102 s，且 fat 需要 `codegen-units=1` 才有收益。
lto = "thin"
codegen-units = 1
