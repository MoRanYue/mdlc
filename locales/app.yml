# mdlc 的译文表。
#
# ⚠️ **源语言是英文** —— 键就是英文原文本身（`rust-i18n` 的 `minify_key`
# 默认关，键不压缩），所以这里**只写译文**：
#
#   * 英文用户 / 系统语言不在下表里 ⟹ `t!` 未命中，回退到键本身（英文）；
#   * 中文用户 ⟹ 命中下面的 `zh-CN`；
#   * 以后加德语 ⟹ 加一列 `de-DE` 即可，未覆盖的条目自动回退英文。
#
# 这与 `clap-i18n-richformatter` 的 ftl 约定一致（它的 `i18n.toml` 是
# `fallback_language = "en-US"`，`zh-CN` 是译文）。也正因为英文就是键，
# `i18n!` 不需要 `fallback = "en"` —— 未命中时的回退目标天然是英文。
#
# ⚠️ 这个文件是在**编译期**由 proc-macro 读盘生成代码的（`i18n!` 展开成
# 一个 `SimpleBackend`），所以它不进二进制；但 cargo **不跟踪**它
# （`rust-i18n` 只为它自己的 `locales/` 发 `rerun-if-changed`）。改完这里
# 必须碰一下某个 `.rs` 才会重编，否则拿到旧译文。
#
# ⚠️ 键与值都写成**双引号**标量：键里含 `:` / `$` / `` ` `` / `→` / `#`
# 这类 YAML 有特殊含义的字符，不加引号会被解析成别的东西；反斜杠在双引号
# 里要写成 `\\`（所以 `<gamedir>\models\` 在源文里是 `<gamedir>\\models\\`）。
#
# ⚠️ 键里的 `\n` 是**真的换行**（YAML 双引号标量的转义），与 Rust 字面量
# 里的 `\n` 一致 —— `Cli` 的 `long_about` 就是把三段用空行拼起来的。
_version: 2

# ---------------------------------------------------------------------------
# 顶层（`mdlc -h` 与 `mdlc --help`）
#
# `-h` 只打第一段（`about`），`--help` 打三段（`long_about` = 三段用空行
# 拼接）—— 这正是 clap 对 `about` / `long_about` 的用法。
# ---------------------------------------------------------------------------

"Source engine model compiler (a studiomdl rewrite)":
  zh-CN: "Source 引擎模型编译器（studiomdl 重写）"

"Compiles a TOML description or a QC script into the Source engine `.mdl` / `.vvd` / `.vtx` / `.phy` set, plus a few read-only inspection and conversion subcommands.":
  zh-CN: "把 TOML 描述或 QC 脚本编译成 Source 引擎的 `.mdl` / `.vvd` / `.vtx` / `.phy` 四件套，另带若干只读的检查与转换子命令。"

"It also works as the official `studiomdl`: `mdlc -game <gamedir> <model.qc>` writes the output under `<gamedir>\\models\\<$modelname>`, so it can be dropped in as Crowbar's compiler path.":
  zh-CN: "也能当官方 `studiomdl` 用：`mdlc -game <gamedir> <model.qc>` 会把产物写到 `<gamedir>\\models\\<$modelname>`，可直接替换 Crowbar 的编译器路径。"

