# ---------------------------------------------------------------------------
# 诊断与错误文案（`log::info!` / `log::warn!` / `log::error!` 与 `#[error(...)]`）
#
# ⚠️ 这一批的源文风格是固定的三个前缀：`Note: ` / `Warning: ` / `Error: `。
# 译文对应「提示：」/「警告：」/「错误：」，与第一期之前的手写文案一致。
#
# ⚠️ 带参数的条目里，占位符写成 `%{名}`（`rust-i18n` 的 `replace_patterns`
# 语法，见 `rust_i18n::replace_patterns`）。**占位符名不翻译**，译文里必须
# 与源文用同一批名字，否则替换不到、用户会看到裸露的 `%{...}`。
#
# ⚠️ 反引号里的命令名 / TOML 键 / QC 关键字（`srcpart` / `$lod` / …）一律
# **不翻译** —— 它们是用户要照着敲的字面量。
# ---------------------------------------------------------------------------

# --- 提示（Note）-----------------------------------------------------------

"Note: the %{n} meshes of %{at} were merged into one part: %{meshes}. The official tool merges them the same way (part boundaries are lost); to keep them apart, select them one by one with `srcpart`, or split them into several `$body` / `$model` blocks.":
  zh-CN: "提示：%{at} 的 %{n} 块网格被合并进同一个部件：%{meshes}。官方同样合并（部件边界丢失）；要分开请用 `srcpart` 逐个选，或拆成多条 `$body` / `$model`。"

"Note: the meshes %{meshes} of %{at} have no material, so %{fallback} was synthesized. To use another name, write `srcmaterial \"...\"`.":
  zh-CN: "提示：%{at} 的网格 %{meshes} 没有材质，已合成 %{fallback}。要改用别的名字写 `srcmaterial \"...\"`。"

"Note: %{at} has %{n} animation stacks %{stacks}; both the official tool and mdlc use only the **first** one by default. To use another, write `srcstack \"name\"` (inside `$sequence` / `$animation`).":
  zh-CN: "提示：%{at} 有 %{n} 条动画栈 %{stacks}；官方与 mdlc 默认都只用**第一条**。要用别的写 `srcstack \"名\"`（写在 `$sequence` / `$animation` 里）。"

"%{name}(frame %{frame})":
  zh-CN: "%{name}(帧 %{frame})"

"Note: the %{n} shape keys of %{at} were registered as flexes automatically: %{list}. To control which ones are taken, their order, or to ignore some, use `srcshapekey` / `srcshapekeyorder` / `srcshapekeyignore`.":
  zh-CN: "提示：%{at} 的 %{n} 个 shape key 已自动注册成 flex：%{list}。要控制取哪些 / 顺序 / 忽略，用 `srcshapekey` / `srcshapekeyorder` / `srcshapekeyignore`。"

"%{path} is used as both the mesh source and the animation source. FBX can hold meshes and animation together, and mdlc read %{n_frames} frames as usual — but the official studiomdl **silently** produces only 1 frame in this combination (measured: exit=0, no warning; see docs/fbx-support.md §4.4). This is a **deliberate deviation**: mdlc does not copy that degenerate behavior. ⚠️ If you are comparing against the official output, a frame-count mismatch here is **expected**. To make the two agree, split the animation into a separate FBX file (both the official tool and mdlc handle that normally).":
  zh-CN: "%{path} 同时用作网格源与动画源。FBX 可以同时包含网格与动画，mdlc 正常采出了 %{n_frames} 帧 —— 但官方 studiomdl 在这个组合下会**静默地**只产出 1 帧（实测 exit=0、无警告，见 docs/fbx-support.md §4.4）。这是**有意的偏离**：mdlc 不复制这个退化行为。⚠️ 若你在与官方产物对照，这里的帧数不一致是**预期**的。想让两边一致，把动画拆到独立的 FBX 文件（官方与 mdlc 都会正常）。"

"Note: the bone %{bone} of %{at} was not found; skipped, matching the official behavior":
  zh-CN: "提示：%{at} 骨骼 %{bone} 找不到，按官方行为跳过"

"Note: %{path} has %{n} animation stacks %{names}; only the **first** one is used by default. To use another, write `srcstack \"name\"` (inside `$sequence` / `$animation`).":
  zh-CN: "提示：%{path} 有 %{n} 条动画栈 %{names}；默认只用**第一条**。要用别的写 `srcstack \"名\"`（写在 `$sequence` / `$animation` 里）。"

"Note: %{path} has %{n} animations %{names}; only the **first** one is used by default. To use another, write `srcstack \"name\"` (inside `$sequence` / `$animation`).":
  zh-CN: "提示：%{path} 有 %{n} 条动画 %{names}；默认只用**第一条**。要用别的写 `srcstack \"名\"`（写在 `$sequence` / `$animation` 里）。"

"Note: %{at} has %{n} accessors without a `bufferView`; per the glTF spec they mean **all zero**, and they were treated that way (the validation layer of `gltf` 1.4.1 misjudges them as an error; mdlc takes the read path that bypasses validation).":
  zh-CN: "提示：%{at} 有 %{n} 个 accessor 没有 `bufferView`；按 glTF 规范它们表示**全零**，已照此处理（`gltf` 1.4.1 的校验层会把它误判为错误，mdlc 走的是绕校验的读取路径）。"

"Note: %{at} has %{n} animation channels interpolated with `CubicSpline`; mdlc resamples them **linearly** (the cubic spline's tangent information is ignored). To avoid this note, make the exporter use `LINEAR`.":
  zh-CN: "提示：%{at} 有 %{n} 个动画通道用 `CubicSpline` 插值；mdlc 按**线性**重采样（三次样条的切线信息被忽略）。要避免这条提示请让导出器改用 `LINEAR`。"

"Note: %{at} has %{n} animation channels driving `MorphTargetWeights` (per-frame morph weights); mdlc does **not** do per-frame morph weights — morphs are controlled only by the QC `flex` statements, and these channels are ignored.":
  zh-CN: "提示：%{at} 有 %{n} 个动画通道驱动 `MorphTargetWeights`（逐帧表情权重）；mdlc **不做**逐帧表情权重 —— 表情只由 QC 的 `flex` 语句控制，这些通道被忽略。"

"Note: the VRD pointed to by $proceduralbones does not exist; skipped, matching the official behavior: %{path}":
  zh-CN: "提示：$proceduralbones 指向的 VRD 不存在，按官方行为跳过：%{path}"

"Note: $lod names %{n} bones that do not exist; skipped, matching the official behavior: %{list}":
  zh-CN: "提示：$lod 里有 %{n} 个不存在的骨骼，已按官方行为跳过：%{list}"

"Note: mdlc %{latest} is available (you have v%{current}) — https://github.com/%{repo}/releases/latest":
  zh-CN: "提示：mdlc 有新版本 %{latest}（当前 v%{current}）—— https://github.com/%{repo}/releases/latest"

