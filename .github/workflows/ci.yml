name: CI

# 目标：让「别人克隆下来能构建、能跑测试」变成**持续验证的事实**，
# 而不是 README 里的一句声称。
#
# 本仓库的差分验证依赖仓库外的素材（官方 studiomdl 产物、L4D2 语料），
# 那些**不在 CI 里跑** —— 6 个需要素材的测试已标 `#[ignore]`，
# 默认测试套件不碰任何外部文件（见 README「测试」一节）。
#
# ⚠️ **为什么 clippy 必须显式列出 lint 等级**：本仓库曾出现「本地 clippy
# 干净、CI 却失败」—— 因为 cargo 的 clippy 结果按**源码内容**缓存，
# 先跑过一次不带 `-D warnings` 的 clippy，之后带 `-D warnings` 的那次会
# **复用缓存直接返回成功**，把 allow-by-default 的 lint（如
# `chunks_exact_to_as_chunks`）全部漏掉。所以这里不依赖裸的
# `-D warnings`，而是显式写出等级，并且 CI 总是全新构建、不受此影响。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主要开发/验证平台；Linux 用来证明**代码本身可移植**
        # （没有平台专有 API）。macOS 未纳入：meshopt 要编 vendored C++，
        # 且本项目面向 Source 引擎的 Windows 工具链。
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # meshopt 会编 vendored C++，需要 C++ 工具链。
      # ubuntu-latest 自带 gcc/g++；windows-latest 自带 MSVC。这里只做确认。
      - name: 确认 C++ 工具链可用
        if: runner.os == 'Linux'
        run: g++ --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --locked

      # 526 个测试，**不需要任何外部素材**。
      # 需要素材的 6 个已 #[ignore]，结果行会显示 "6 ignored"。
      - name: cargo test
        run: cargo test --release --locked

      # profiling feature 也必须能编过（探针配置的回归纪律）。
      - name: cargo test（profiling feature）
        run: cargo test --release --locked --features profiling

      # ⚠️ 显式把 clippy 的**默认与 pedantic 之外的全部 lint** 提到 deny，
      # 而不是只靠 `-D warnings` —— 理由见文件头注释（缓存会让
      # `-D warnings` 静默复用旧结果，漏掉 allow-by-default 的 lint）。
      # `-W clippy::all` 把整组推成 warning，再由 `-D warnings` 变 error。
      - name: cargo clippy
        run: |
          cargo clippy --release --all-targets --locked -- \
            -W clippy::all -D warnings

      - name: cargo clippy（profiling feature）
        run: |
          cargo clippy --release --all-targets --locked --features profiling -- \
            -W clippy::all -D warnings

      # 文档链接也会烂（数组下标被当成 intra-doc link、链接到私有项、
      # 路径改名后没跟着改）。钉住它，免得下次又攒回几十条。
      - name: cargo doc（零警告）
        run: cargo doc --no-deps --locked -- -D warnings

  msrv:
    name: MSRV（Cargo.toml 的 rust-version 必须是真的）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 这条 job 存在的理由：Cargo.toml 曾把 rust-version 写成 1.85，
      # 而源码里用了 `let`-chains（1.88 才稳定）—— **声称的 MSRV 是假的**。
      # 这里用 Cargo.toml 里声明的版本实际编一遍，防止再次跑偏。
      - name: 读出声明的 MSRV
        id: msrv
        shell: bash
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml 声明 MSRV = $v"

      - name: 安装该工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: 用声明的 MSRV 构建 + 测试
        run: |
          cargo build --release --locked
          cargo test --release --locked
