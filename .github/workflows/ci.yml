name: CI

# 目标：让「别人克隆下来能构建、能跑测试」变成**持续验证的事实**，
# 而不是 README 里的一句声称。
#
# 本仓库的差分验证依赖仓库外的素材（官方 studiomdl 产物、L4D2 语料），
# 那些**不在 CI 里跑** —— 6 个需要素材的测试已标 `#[ignore]`，
# 默认测试套件不碰任何外部文件（见 README「测试」一节）。
#
# ⚠️ **为什么 clippy 必须显式列出 lint 等级**：本仓库曾出现「本地 clippy
# 干净、CI 却失败」—— 因为 cargo 的 clippy 结果按**源码内容**缓存，
# 先跑过一次不带 `-D warnings` 的 clippy，之后带 `-D warnings` 的那次会
# **复用缓存直接返回成功**，把 allow-by-default 的 lint（如
# `chunks_exact_to_as_chunks`）全部漏掉。所以这里不依赖裸的
# `-D warnings`，而是显式写出等级，并且 CI 总是全新构建、不受此影响。
#
# ⚠️ **为什么测试跑 debug 而构建跑 release**：
#
# `[profile.release]` 是 `lto = "thin"` + `codegen-units = 1` —— 对**发布产物**
# 是对的，但拿它跑测试是**双输**：
#
# 1. **慢**：codegen-units = 1 让 codegen 无法并行。本机实测（28 逻辑核，
#    各自全新 target 目录）`cargo test --no-run`：
#      thin LTO + cgu=1 → 161.8s
#      无 LTO   + cgu=16 →  35.7s      （4.5×）
#    CI 上差距更大：Windows job 14 分钟里有 **12.5 分钟是编译**，
#    而测试本身只跑 1.67s。
# 2. **弱**：`--release` 下 `debug_assert!` 被静默编译掉。本仓库有 22 处
#    `debug_assert`（mdl_writer 6 / anim_writer 4 / vvd 4 / phy 3 /
#    bone_math 2 / vtx_writer 2 / ani_writer 1），用 release 跑测试
#    等于**从来没验证过它们**。
#
# 所以：`cargo build --release` 保留（证明 release profile 真的编得出来），
# 测试全部走默认的 debug profile（同时验证 `debug_assert`）。
# 判据来自 `cargo rustc --lib -- --print cfg`：debug 有 `debug_assertions`，
# release 没有。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主要开发/验证平台；Linux 用来证明**代码本身可移植**
        # （没有平台专有 API）。macOS 未纳入：meshopt 要编 vendored C++，
        # 且本项目面向 Source 引擎的 Windows 工具链。
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # meshopt 会编 vendored C++，需要 C++ 工具链。
      # ubuntu-latest 自带 gcc/g++；windows-latest 自带 MSVC。这里只做确认。
      - name: 确认 C++ 工具链可用
        if: runner.os == 'Linux'
        run: g++ --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --locked

      # 783 个测试，**不需要任何外部素材**。
      # 需要素材的 6 个已 #[ignore]，结果行会显示 "6 ignored"。
      #
      # ⚠️ 不写 `--release`：理由见文件头「为什么测试跑 debug 而构建跑 release」。
      # 顺带让 22 处 `debug_assert` 真正生效。
      #
      # 输出同时 tee 到文件，供下一步的计数断言读取 —— 否则断言步骤要把
      # 整个测试套件**再跑一遍**（旧版就是这样，白花一次全量测试的时间）。
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          cargo test --locked 2>&1 | tee target/test-output.txt

      # ⚠️ 防止 CI 变成**空洞的绿**：如果有人把测试大量标 `#[ignore]`
      # （或测试被误删），上一步依然退出 0。这里显式要求
      # 「通过数 ≥ 520 且 ignored ≤ 6」。
      # 本项目被空洞测试坑过多次，所以对 CI 自己也设一条非空洞判据。
      #
      # ⚠️ 读上一步 tee 出来的文件，**不重跑测试** —— 旧版在这里又跑了一次
      # 全量测试，在 Windows 上白花 278s。
      - name: 断言测试计数（防空洞绿）
        shell: bash
        run: |
          set -o pipefail
          if [ ! -s target/test-output.txt ]; then
            echo "::error::没找到 target/test-output.txt —— 上一步的 tee 没生效？"
            exit 1
          fi
          tail -5 target/test-output.txt
          # ⚠️ 直接 grep 文件，不要 `out=$(cat ...)`：测试输出里有 NUL 字节，
          # 命令替换会告警（`ignored null byte in input`）并可能截断内容。
          passed=$(grep -oE '[0-9]+ passed' target/test-output.txt | head -1 | grep -oE '[0-9]+')
          ignored=$(grep -oE '[0-9]+ ignored' target/test-output.txt | head -1 | grep -oE '[0-9]+')
          echo "passed=$passed ignored=$ignored"
          if [ "${passed:-0}" -lt 520 ]; then
            echo "::error::通过数只有 $passed（期望 ≥520）—— 测试被跳过或删除了？"
            exit 1
          fi
          if [ "${ignored:-99}" -gt 6 ]; then
            echo "::error::ignored 有 $ignored 个（期望 ≤6）—— 新增了跳过的测试？"
            exit 1
          fi

      # hotpath feature 也必须能编过（探针配置的回归纪律）。
      # ⚠️ 同样走 debug：这个 feature 会展开 `hotpath` 宏，debug 下同样能验证。
      - name: cargo test（hotpath feature）
        run: cargo test --locked --features hotpath

      # ⚠️ 显式把 clippy 的 lint 组推到 deny，而不是只靠裸的 `-D warnings`
      # —— 理由见文件头注释（缓存会让 `-D warnings` 静默复用旧结果，
      # 漏掉 allow-by-default 的 lint，如 `chunks_exact_to_as_chunks`）。
      #
      # ⚠️ **必须写成单行**：Windows runner 的 shell 是 pwsh，而 pwsh 的
      # 续行符是反引号，不是 bash 的反斜杠 —— 用 `\` 续行会被当成一个
      # 普通参数，导致 Windows 上 clippy 直接失败（Ubuntu 却能过）。
      - name: cargo clippy
        run: cargo clippy --release --all-targets --locked -- -W clippy::all -D warnings

      - name: cargo clippy（hotpath feature）
        run: cargo clippy --release --all-targets --locked --features hotpath -- -W clippy::all -D warnings

      # 文档链接也会烂（数组下标被当成 intra-doc link、链接到私有项、
      # 路径改名后没跟着改）。钉住它，免得下次又攒回几十条。
      #
      # ⚠️ rustdoc 的参数**不能**放在 `cargo doc --` 后面
      # （`cargo doc -- -D warnings` 会报 `unexpected argument '-D'`，
      # 因为 `cargo doc` 本身不接受尾随参数）。必须用 `RUSTDOCFLAGS`。
      - name: cargo doc（零警告）
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV（Cargo.toml 的 rust-version 必须是真的）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ⚠️ 这条 job 存在的理由：Cargo.toml 曾把 rust-version 写成 1.85，
      # 而源码里用了 `let`-chains（1.88 才稳定）—— **声称的 MSRV 是假的**。
      # 这里用 Cargo.toml 里声明的版本实际编一遍，防止再次跑偏。
      - name: 读出声明的 MSRV
        id: msrv
        shell: bash
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml 声明 MSRV = $v"

      - name: 安装该工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # ⚠️ 这里**不**用 `--release`：本 job 要回答的问题是「源码能不能被这个
      # rustc 编出来、测试过不过」—— debug profile 同样能回答，而且快得多。
      # release profile（thin LTO + cgu=1）由上面 test job 在**同一个提交**上验证。
      - name: 用声明的 MSRV 构建 + 测试
        run: |
          cargo build --locked
          cargo test --locked
