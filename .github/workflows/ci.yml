name: CI

# 目标：让「别人克隆下来能构建、能跑测试」变成**持续验证的事实**，
# 而不是 README 里的一句声称。
#
# 本仓库的差分验证依赖仓库外的素材（官方 studiomdl 产物、L4D2 语料），
# 那些**不在 CI 里跑** —— 6 个需要素材的测试已标 `#[ignore]`，
# 默认测试套件不碰任何外部文件（见 README「测试」一节）。
#
# ⚠️ **为什么 clippy 必须显式列出 lint 等级**：本仓库曾出现「本地 clippy
# 干净、CI 却失败」—— 因为 cargo 的 clippy 结果按**源码内容**缓存，
# 先跑过一次不带 `-D warnings` 的 clippy，之后带 `-D warnings` 的那次会
# **复用缓存直接返回成功**，把 allow-by-default 的 lint（如
# `chunks_exact_to_as_chunks`）全部漏掉。所以这里不依赖裸的
# `-D warnings`，而是显式写出等级，并且 CI 总是全新构建、不受此影响。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主要开发/验证平台；Linux 用来证明**代码本身可移植**
        # （没有平台专有 API）。macOS 未纳入：meshopt 要编 vendored C++，
        # 且本项目面向 Source 引擎的 Windows 工具链。
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # meshopt 会编 vendored C++，需要 C++ 工具链。
      # ubuntu-latest 自带 gcc/g++；windows-latest 自带 MSVC。这里只做确认。
      - name: 确认 C++ 工具链可用
        if: runner.os == 'Linux'
        run: g++ --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --locked

      # 526 个测试，**不需要任何外部素材**。
      # 需要素材的 6 个已 #[ignore]，结果行会显示 "6 ignored"。
      - name: cargo test
        run: cargo test --release --locked

      # ⚠️ 防止 CI 变成**空洞的绿**：如果有人把测试大量标 `#[ignore]`
      # （或测试被误删），上一步依然退出 0。这里显式要求
      # 「通过数 ≥ 520 且 ignored ≤ 6」。
      # 本项目被空洞测试坑过多次，所以对 CI 自己也设一条非空洞判据。
      - name: 断言测试计数（防空洞绿）
        shell: bash
        run: |
          set -o pipefail
          out=$(cargo test --release --locked 2>&1)
          echo "$out" | tail -5
          passed=$(echo "$out" | grep -oE '[0-9]+ passed' | head -1 | grep -oE '[0-9]+')
          ignored=$(echo "$out" | grep -oE '[0-9]+ ignored' | head -1 | grep -oE '[0-9]+')
          echo "passed=$passed ignored=$ignored"
          if [ "${passed:-0}" -lt 520 ]; then
            echo "::error::通过数只有 $passed（期望 ≥520）—— 测试被跳过或删除了？"
            exit 1
          fi
          if [ "${ignored:-99}" -gt 6 ]; then
            echo "::error::ignored 有 $ignored 个（期望 ≤6）—— 新增了跳过的测试？"
            exit 1
          fi

      # profiling feature 也必须能编过（探针配置的回归纪律）。
      - name: cargo test（profiling feature）
        run: cargo test --release --locked --features profiling

      # ⚠️ 显式把 clippy 的 lint 组推到 deny，而不是只靠裸的 `-D warnings`
      # —— 理由见文件头注释（缓存会让 `-D warnings` 静默复用旧结果，
      # 漏掉 allow-by-default 的 lint，如 `chunks_exact_to_as_chunks`）。
      #
      # ⚠️ **必须写成单行**：Windows runner 的 shell 是 pwsh，而 pwsh 的
      # 续行符是反引号，不是 bash 的反斜杠 —— 用 `\` 续行会被当成一个
      # 普通参数，导致 Windows 上 clippy 直接失败（Ubuntu 却能过）。
      - name: cargo clippy
        run: cargo clippy --release --all-targets --locked -- -W clippy::all -D warnings

      - name: cargo clippy（profiling feature）
        run: cargo clippy --release --all-targets --locked --features profiling -- -W clippy::all -D warnings

      # 文档链接也会烂（数组下标被当成 intra-doc link、链接到私有项、
      # 路径改名后没跟着改）。钉住它，免得下次又攒回几十条。
      #
      # ⚠️ rustdoc 的参数**不能**放在 `cargo doc --` 后面
      # （`cargo doc -- -D warnings` 会报 `unexpected argument '-D'`，
      # 因为 `cargo doc` 本身不接受尾随参数）。必须用 `RUSTDOCFLAGS`。
      - name: cargo doc（零警告）
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV（Cargo.toml 的 rust-version 必须是真的）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 这条 job 存在的理由：Cargo.toml 曾把 rust-version 写成 1.85，
      # 而源码里用了 `let`-chains（1.88 才稳定）—— **声称的 MSRV 是假的**。
      # 这里用 Cargo.toml 里声明的版本实际编一遍，防止再次跑偏。
      - name: 读出声明的 MSRV
        id: msrv
        shell: bash
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml 声明 MSRV = $v"

      - name: 安装该工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: 用声明的 MSRV 构建 + 测试
        run: |
          cargo build --release --locked
          cargo test --release --locked
